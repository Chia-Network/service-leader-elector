apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-leader-elector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: service-leader-elector
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: service-leader-elector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: service-leader-elector
subjects:
  - kind: ServiceAccount
    name: service-leader-elector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-leader-elector
  labels:
    app: service-leader-elector
spec:
  replicas: 3
  selector:
    matchLabels:
      app: service-leader-elector
  template:
    metadata:
      labels:
        app: service-leader-elector
    spec:
      serviceAccountName: service-leader-elector
      containers:
        - name: service-leader-elector
          image: ghcr.io/chia-network/service-leader-elector:latest
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: service-leader-elector
spec:
  selector:
    app: service-leader-elector
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: service-leader-elector-leader
spec:
  selector:
    app: service-leader-elector
    leader: "true"
  ports:
    - port: 8080
      targetPort: http
